name: km2apps
description: تطبيق خلفيات عالي الجودة

environment:
  # ✅ Flutter 3.27+ مطلوب لأن الكود يستخدم Color.withValues(alpha:)
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

publish_to: 'none'
version: 1.1.0+17

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # State Management & Ads
  provider: ^6.1.1
  google_mobile_ads: ^5.1.0

  # Images & UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Network
  dio: ^5.4.0

  # Local Data & Utilities
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  permission_handler: ^11.2.0
  saver_gallery: ^3.0.6
  share_plus: ^12.0.2
  device_info_plus: ^10.1.0

  # لوحة تحكم المشرف — اختيار الصورة من المعرض قبل رفعها
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700